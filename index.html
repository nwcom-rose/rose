<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西北語薇星際艙</title>
    <link rel="stylesheet" href="css/styles.css?v=20261011-logo-file">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app" class="app-container">
      <div class="stars-bg" id="starsBg"></div>
      <!-- Header Bar -->
      <header class="header-bar">
        <div class="header-logo">
          <img class="logo-bowtie" src="assets/logo.svg" alt="西北語薇 LOGO"
               onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><defs><pattern id=%22s%22 patternUnits=%22userSpaceOnUse%22 width=%2212%22 height=%2212%22 patternTransform=%22rotate(45)%22><rect width=%226%22 height=%2212%22 fill=%22%23e53935%22/><rect x=%226%22 width=%226%22 height=%2212%22 fill=%22%23141414%22/></pattern></defs><path d=%22M4 18 Q20 22 30 32 Q20 42 4 46 Q14 32 4 18 Z%22 fill=%22url(%23s)%22 stroke=%22%235a0000%22 stroke-width=%221.2%22/><path d=%22M60 18 Q44 22 34 32 Q44 42 60 46 Q50 32 60 18 Z%22 fill=%22url(%23s)%22 stroke=%22%235a0000%22 stroke-width=%221.2%22/><path d=%22M26 24 L38 24 Q40 24 40 32 Q40 40 38 40 L26 40 Q24 40 24 32 Q24 24 26 24 Z%22 fill=%22url(%23s)%22 stroke=%22%235a0000%22 stroke-width=%221.2%22/></svg>'"/>
          <span class="header-title">西北語薇 · 星際艙</span>
        </div>
        <div class="header-user">
          <div class="starlight-cert" id="starlightCert" style="display:none;">
            <span class="level-badge" id="userLevel">LV1 見習艙員</span>
            <div class="exp-bar-wrap"><div class="exp-bar" id="userExpBar"></div></div>
            <span class="coins">✦ <span id="userCoins">0</span></span>
          </div>
          <button class="btn btn-ghost" id="installBtn" style="display:none;">↓ 安裝</button>
          <button class="btn" id="authBtn">登入 / 註冊</button>
        </div>
      </header>
      <!-- Main Content -->
      <main class="main-content">
        <!-- Home Page - Cockpit Full BG -->
        <section class="page page-transition cockpit-page active" id="page-home" data-level="0">
          <div class="cockpit-bg">
            <!-- 優先讀取使用者放置的真實背景圖 -->
            <img src="assets/cockpit-bg.jpg" alt="西北語薇星際駕駛艙"
                 onerror="this.onerror=null;this.src='https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=Interior%20of%20a%20futuristic%20sci-fi%20spacecraft%20cockpit%20control%20room%20with%20dark%20red%20and%20black%20color%20scheme%2C%20multiple%20HUD%20screens%20on%20top%2C%20a%20steering%20wheel%20console%20in%20the%20middle%2C%20pilot%20seat%20on%20right%2C%20storage%20locker%20box%20on%20left%2C%20holographic%20community%20map%20projector%20in%20bottom%20center%2C%20double%20unboxing%20screens%20bottom%20left%2C%20news%20ticker%20screen%20and%20shield%20honor%20display%20bottom%20right%2C%20space%20nebula%20red%20swirl%20outside%20the%20window%2C%20anime%20illustration%20style%2C%20cinematic%20lighting%2C%20highly%20detailed&image_size=portrait_16_9';"
                 referrerpolicy="no-referrer" />
            <!-- 駕駛艙窗外景色動畫：星際穿越流動星點 + 星雲脈動光暈 -->
            <div class="cockpit-window-anim">
              <div class="star-layer star-layer-1"></div>
              <div class="star-layer star-layer-2"></div>
              <div class="star-layer star-layer-3"></div>
              <div class="nebula-glow nebula-red"></div>
              <div class="nebula-glow nebula-purple"></div>
              <div class="floating-particles">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div class="cockpit-vignette"></div>
          </div>
          <!-- 西北語薇人物 — 優先載入 assets/yuwei.png，否則 fallback 生成圖 -->
          <div class="cockpit-figures">
            <img class="yuwei-figure" src="assets/yuwei.png" alt="西北語薇"
                 onerror="this.onerror=null;this.src='https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=full%20body%20portrait%20of%20a%20young%20beautiful%20asian%20woman%20with%20long%20black%20hair%20in%20high%20ponytail%2C%20wearing%20red%20sci-fi%20goggles%20on%20forehead%2C%20red%20and%20black%20tech%20jacket%20with%20red%20black%20striped%20bow%20tie%2C%20badge%20on%20left%20chest%2C%20glowing%20device%20on%20left%20forearm%2C%20black%20pants%2C%20black%20boots%2C%20standing%20front%20view%2C%20isolated%20on%20transparent%20background%2C%20realistic%20style%2C%20high%20detail&image_size=portrait_16_9';"
                 referrerpolicy="no-referrer" />
          </div>
          <div class="cockpit-hotspots">
            <button class="hotspot-btn hs-about" data-topic="about">
              <span class="hs-text">關於語薇</span></button>
            <button class="hotspot-btn hs-music" data-topic="music">
              <span class="hs-text">語薇創作曲</span></button>
            <button class="hotspot-btn hs-daily" data-topic="daily">
              <span class="hs-text">語薇日常</span></button>
            <button class="hotspot-btn hs-toolbox" data-topic="toolbox">
              <span class="hs-text">社區百寶箱</span></button>
            <button class="hotspot-btn hs-unbox" data-topic="unbox">
              <span class="hs-text">語薇開箱去</span></button>
            <button class="hotspot-btn hs-neighbor" data-topic="neighbor">
              <span class="hs-text">鄰里好生活</span></button>
            <button class="hotspot-btn hs-news" data-topic="news">
              <span class="hs-text">社區快訊</span></button>
            <button class="hotspot-btn hs-hero" data-topic="hero">
              <span class="hs-text">社區英雄</span></button>
          </div>
          <!-- 舊元素保留以防止 JS 報錯，但 CSS 強制隱藏 -->
          <div class="home-hero" style="display:none"></div>
          <div class="menu-3d-wrap" style="display:none"><div class="menu-3d-grid" id="menuGrid"></div></div>
        </section>
        <!-- Sub pages will be injected via JS -->
      </main>
      <!-- PWA 安裝提示 Modal -->
      <div class="modal-overlay" id="pwaInstallModal">
        <div class="modal-box pwa-install-box">
          <div class="pwa-install-icon">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <pattern id="pwaBowtie" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
                  <rect width="6" height="12" fill="#e53935"/>
                  <rect x="6" width="6" height="12" fill="#141414"/>
                </pattern>
              </defs>
              <path d="M4 18 Q20 22 30 32 Q20 42 4 46 Q14 32 4 18 Z" fill="url(#pwaBowtie)" stroke="#5a0000" stroke-width="1.2"/>
              <path d="M60 18 Q44 22 34 32 Q44 42 60 46 Q50 32 60 18 Z" fill="url(#pwaBowtie)" stroke="#5a0000" stroke-width="1.2"/>
              <path d="M26 24 L38 24 Q40 24 40 32 Q40 40 38 40 L26 40 Q24 40 24 32 Q24 24 26 24 Z" fill="url(#pwaBowtie)" stroke="#5a0000" stroke-width="1.2"/>
            </svg>
          </div>
          <h2 class="modal-title">安裝西北語薇</h2>
          <p class="modal-subtitle">將星際艙安裝到你的裝置，隨時與語薇展開冒險</p>
          <ul class="pwa-features">
            <li>🚀 一鍵開啟，離線也能暢遊星際</li>
            <li>📱 全螢幕沉浸式體驗</li>
            <li>⭐ 專屬西北語薇 APP 圖示</li>
          </ul>
          <div class="pwa-install-actions">
            <button class="btn btn-block" id="pwaInstallBtn">立即安裝</button>
            <button class="btn btn-ghost" id="pwaLaterBtn">稍後再說</button>
          </div>
        </div>
      </div>
      <!-- Login / Register Modal -->
      <div class="modal-overlay" id="authModal">
        <div class="modal-box">
          <h2 class="modal-title" id="authModalTitle">登入星光艙</h2>
          <p class="modal-subtitle" id="authModalSubtitle">與語薇一起展開星際冒險</p>
          <form id="authForm">
            <div class="form-group" id="nameGroup" style="display:none;">
              <label>艙員暱稱</label>
              <input type="text" id="inputName" placeholder="輸入你的星際名號" maxlength="20"/>
            </div>
            <div class="form-group">
              <label>電子郵件</label>
              <input type="email" id="inputEmail" placeholder="star@nwrose.tw" required/>
            </div>
            <div class="form-group">
              <label>密碼</label>
              <input type="password" id="inputPassword" placeholder="至少 6 個字元" minlength="6" required/>
            </div>
            <button type="submit" class="btn btn-block" id="authSubmitBtn">登入</button>
          </form>
          <div class="modal-divider">或</div>
          <button class="btn-google" id="googleSignInBtn">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.795 2.255-2.251 4.188-4.085 5.57l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
            以 Google 帳號繼續
          </button>
          <div class="modal-switch">
            <span id="authModeSwitch">還沒有星光證？立即註冊</span>
          </div>
        </div>
      </div>
      <!-- Level Up Overlay -->
      <div class="level-up-overlay" id="levelUpOverlay">
        <div class="level-up-content">
          <div class="level-up-badge" id="levelUpBadge">LV UP!</div>
          <div class="level-up-title" id="levelUpTitle">升級為見習艙員</div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAH3dKwLLlg5-5jPwEbIZ2WKP41TaV68EY",
            authDomain: "nw-rose.firebaseapp.com",
            projectId: "nw-rose",
            storageBucket: "nw-rose.firebasestorage.app",
            messagingSenderId: "308252489419",
            appId: "1:308252489419:web:455d75bcc6398e78660d4e",
            measurementId: "G-3W3PYCF1D8"
        };
        firebase.initializeApp(firebaseConfig);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker 註冊成功:', registration);
                    })
                    .catch(error => {
                        console.log('Service Worker 註冊失敗:', error);
                    });
            });
        }
    </script>
    <script src="js/app.js?v=20261011-pwa-install"></script>
</body>
</html>
